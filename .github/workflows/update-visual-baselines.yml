name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update baselines on
        required: false
        default: ''

permissions:
  contents: write

env:
  HUSKY: 0
  NODE_ENV: development
  # The workspace whose baselines are updated
  APP: apps/garbereder.com

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    # Same image as the visual job in static.yml, so baselines match what CI renders
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-node
      - run: npm run build -w $APP
      - run: npx playwright install chromium
      - run: npm run test:visual:update -w $APP
      - name: Commit and push updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$APP"/tests/*-snapshots/
          git diff --staged --quiet || git commit -m "chore(tests): update visual regression baselines"
          git push
