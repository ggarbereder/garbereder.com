name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update baselines on
        required: false
        default: ''

permissions:
  contents: write

env:
  HUSKY: 0
  NODE_ENV: development

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-node
        with:
          scripts: true
      - run: rm -rf cypress-image-diff-screenshots/baseline
      - uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run dev
          wait-on: http://localhost:4321
          config: baseUrl=http://localhost:4321
          spec: cypress/e2e/visual/**/*.cy.js
        env:
          CYPRESS_COVERAGE: false
      - name: Commit and push updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cypress-image-diff-screenshots/baseline/
          git diff --staged --quiet || git commit -m "chore(tests): update visual regression baselines [skip ci]"
          git push
