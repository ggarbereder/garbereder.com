name: Build and Deploy (main only) to Pages and Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HUSKY: 0
  NODE_ENV: development

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npx update-browserslist-db@latest
      - run: npm run security:audit
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npm run build
      - run: npm run test:html
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Tests run against the same dist/ that gets deployed, served by astro preview.
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end, accessibility, SEO and CSP
        run: npm run test:e2e
      - name: Visual regression
        run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
