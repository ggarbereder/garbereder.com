name: Build and Deploy (main only) content to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HUSKY: 0
  NODE_ENV: development

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npx update-browserslist-db@latest
      - run: npm run security:audit
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
        with:
          scripts: true
      - name: Accessibility checks
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run dev
          wait-on: http://localhost:4321
          command: npm run cy:run:a11y
      - name: Cypress run with coverage (functional specs)
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run dev
          wait-on: http://localhost:4321
          config: baseUrl=http://localhost:4321
          spec: cypress/e2e/Index/**/*.cy.js,cypress/e2e/StartAt05/**/*.cy.js
        env:
          CYPRESS_COVERAGE: true
      # Visual baselines are captured without Istanbul; coverage slows the
      # opacity-reveal and screenshots catch a half-revealed page.
      - name: Visual regression (no coverage)
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run dev
          wait-on: http://localhost:4321
          config: baseUrl=http://localhost:4321
          spec: cypress/e2e/visual/**/*.cy.js
      # Astro 7 coverage HTML uses "?" in filenames; upload-artifact rejects them.
      - name: Strip coverage report files with invalid names
        if: always()
        run: find coverage -name '*\?*' -delete || true
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-failures
          path: |
            cypress/screenshots
            cypress-image-diff-screenshots/diff
            cypress-image-diff-screenshots/comparison
          if-no-files-found: ignore

  deploy:
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/
      - id: deployment
        uses: actions/deploy-pages@v5
