name: Build and Deploy (main only) to Pages and Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HUSKY: 0
  NODE_ENV: development

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npx update-browserslist-db@latest
      - run: npm run security:audit
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npm run build
      - run: npm run test:html
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Tests run against the same dist/ that gets deployed, served by astro preview.
  # One job per browser engine, in parallel with visual.
  # The Playwright image has the browsers' system libraries; installing them with apt took 10+ minutes for WebKit.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            browser: chromium
            run: npm run test:e2e -- --project=desktop --project=mobile --project=reflow
          - name: firefox
            browser: firefox
            run: npm run test:e2e -- --project=firefox
          - name: webkit
            browser: webkit
            run: npm run test:e2e -- --project=iphone
    name: e2e (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # No-op while the image matches @playwright/test; fetches only the browser if they drift apart
      - run: npx playwright install ${{ matrix.browser }}
      - run: ${{ matrix.run }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Not in the Playwright image: the Linux baselines were taken on the plain runner, and fonts render differently in the image
  visual:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Required status check for main; passes only if every e2e job and visual passed
  test:
    runs-on: ubuntu-latest
    needs: [e2e, visual]
    if: always()
    steps:
      - run: test "${{ needs.e2e.result }}" = success && test "${{ needs.visual.result }}" = success

  deploy:
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
